name: Temporary patched Next lock generation

on:
  pull_request:
    branches: [main]
    paths:
      - frontend/package.json
      - .github/workflows/next-security-lock-generation.yml

permissions:
  contents: read

jobs:
  regenerate-lock:
    if: github.head_ref == 'security/nextjs-16-4-2-audit-fix' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Generate lockfile using verified public npm registry
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --save-exact next@16.4.2
          npm audit --omit=dev --audit-level=high
      - name: Emit generated lock for connector handoff
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const value = fs.readFileSync('frontend/package-lock.json', 'utf8');
          console.log('LOCK_BEGIN');
          for (let i = 0; i < value.length; i += 400) {
            console.log('LOCK_CHUNK:' + JSON.stringify(value.slice(i, i + 400)));
          }
          console.log('LOCK_END');
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextjs-patched-lockfile
          path: frontend/package-lock.json
          retention-days: 1
