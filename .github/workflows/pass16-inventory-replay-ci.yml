name: Pass 16 Inventory HTTP outage and replay

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-http-replay:
    name: Isolated Inventory stock outage replay and reversal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos_pass16_inventory_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pos -d pos_pass16_inventory_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+psycopg://pos:pos@127.0.0.1:5432/pos_pass16_inventory_ci
      SECRET_KEY: Pass16InventorySigningSecret_2026_123456789012345
      ACCOUNTING_INTEGRATION_SECRET: Pass16InventoryAccountingSecret_2026_1234567890
      INTEGRATION_API_KEY: Pass16InventoryIntegrationKey_2026_1234567890
      INVENTORY_INTEGRATION_ENABLED: 'true'
      INVENTORY_API_BASE: http://127.0.0.1:18992/api/v1
      INVENTORY_INTEGRATION_TOKEN: Pass16InventoryReplayToken2026_ABCDEF012345
      INVENTORY_POS_EVENTS_PATH: /integrations/pos/events
      PASS16_INVENTORY_REPLAY_CI: '1'
      PYTHONPATH: .
      ALLOW_DEFAULT_ADMIN_BOOTSTRAP: 'false'
      STARTUP_REQUIRE_MIGRATIONS: 'true'
      RATE_LIMIT_ENABLED: 'false'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
      - name: Upgrade disposable PostgreSQL schema
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current | grep 0013_generic_selling_rules
          alembic check
      - name: Start isolated synthetic Inventory receiver
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/pass16_inventory_replay_stub.py > /tmp/pass16-inventory-stub.log 2>&1 &
          echo $! > /tmp/pass16-inventory-stub.pid
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18992/healthz >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/pass16-inventory-stub.log || true
          exit 1
      - name: Require fail-closed unknown route and missing integration token
        run: |
          set -euo pipefail
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18992/api/v1/unknown)" = 404
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"external_event_id":"pos:pass16-inventory-order-1:sale_completed"}' http://127.0.0.1:18992/api/v1/integrations/pos/events)" = 401
      - name: Exercise real Inventory outbox outage, lost ACK, replay and reversal
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/pass16_inventory_replay.py | tee /tmp/pass16-inventory-replay.txt
          for result in \
            PASS16_INVENTORY_OUTAGE_SOURCE_EVENT_PRESERVED \
            PASS16_INVENTORY_OUTAGE_RECOVERY \
            PASS16_INVENTORY_REVERSAL_WAITS_FOR_SALE \
            PASS16_INVENTORY_LOST_ACK_EVENT_RETRYABLE \
            PASS16_INVENTORY_LOST_ACK_IDEMPOTENT_REPLAY \
            PASS16_INVENTORY_ORIGINAL_SKU_REVERSAL \
            PASS16_INVENTORY_NO_REDELIVERY_AFTER_ACK \
            PASS16_INVENTORY_HTTP_REPLAY_CERTIFICATION
          do
            grep -qx "$result=PASS" /tmp/pass16-inventory-replay.txt
          done
      - name: Summarize synthetic-only acceptance scope
        run: |
          {
            echo '### Pass 16 Inventory HTTP delivery resilience'
            echo "Commit: $GITHUB_SHA"
            echo 'Ephemeral PostgreSQL 16 and loopback-only, synthetic stock receiver.'
            echo 'Tests: HTTP 503 before stock write, retry after restoration, accepted write with lost ACK, stable external_event_id and no duplicate stock movement.'
            echo 'Also verifies void cannot overtake the unacknowledged sale and original sale SKU/quantity are used for reversal.'
            echo 'No real Inventory, Accounting, production sales, credentials or stock changes.'
            echo 'Does not certify the actual Inventory staging API or operational acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain non-sensitive synthetic replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pass16-inventory-http-replay
          path: /tmp/pass16-inventory-replay.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Show receiver diagnostics only on failure
        if: failure()
        run: tail -50 /tmp/pass16-inventory-stub.log || true
      - name: Stop local receiver
        if: always()
        run: |
          if test -f /tmp/pass16-inventory-stub.pid; then
            kill "$(cat /tmp/pass16-inventory-stub.pid)" 2>/dev/null || true
          fi
