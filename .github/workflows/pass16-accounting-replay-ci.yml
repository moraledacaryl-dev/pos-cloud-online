name: Pass 16 Accounting HTTP outage and replay

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accounting-http-replay:
    name: Isolated Accounting 503 recovery and idempotent replay
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos_pass16_accounting_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pos -d pos_pass16_accounting_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GITHUB_ACTIONS: 'true'
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+psycopg://pos:pos@127.0.0.1:5432/pos_pass16_accounting_ci
      SECRET_KEY: Pass16AccountingReplaySigningSecret_2026_1234567890
      ACCOUNTING_INTEGRATION_SECRET: Pass16AccountingReplaySecret_2026_1234567890
      INTEGRATION_API_KEY: Pass16AccountingReplayIntegrationKey_2026_1234567890
      ALLOW_DEFAULT_ADMIN_BOOTSTRAP: 'false'
      STARTUP_REQUIRE_MIGRATIONS: 'true'
      RATE_LIMIT_ENABLED: 'false'
      PASS16_ACCOUNTING_REPLAY_CI: '1'
      PYTHONPATH: backend
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked backend requirements
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
      - name: Migrate isolated POS PostgreSQL
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current | grep 0013_generic_selling_rules
          alembic check
      - name: Start loopback-only synthetic Accounting intake
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/pass16_accounting_replay_stub.py > /tmp/pass16-accounting-stub.log 2>&1 &
          echo $! > /tmp/pass16-accounting-stub.pid
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18991/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pass16-accounting-stub.log || true
          exit 1
      - name: Assert unknown Accounting routes fail closed
        run: |
          set -euo pipefail
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18991/api/missing-route)" = 404
      - name: Exercise real POS outbox on HTTP outage lost ACK and replay
        working-directory: backend
        run: |
          set -euo pipefail
          python scripts/pass16_accounting_replay.py | tee /tmp/pass16-accounting-replay.txt
          grep -q '^PASS16_ACCOUNTING_UNAVAILABLE_LOCAL_ORDER_PRESERVED=PASS$' /tmp/pass16-accounting-replay.txt
          grep -q '^PASS16_ACCOUNTING_OUTAGE_RECOVERY=PASS$' /tmp/pass16-accounting-replay.txt
          grep -q '^PASS16_ACCOUNTING_LOST_ACK_RETAINED_FOR_RETRY=PASS$' /tmp/pass16-accounting-replay.txt
          grep -q '^PASS16_ACCOUNTING_LOST_ACK_IDEMPOTENT_REPLAY=PASS$' /tmp/pass16-accounting-replay.txt
          grep -q '^PASS16_ACCOUNTING_HTTP_REPLAY_CERTIFICATION=PASS$' /tmp/pass16-accounting-replay.txt
      - name: Record explicitly synthetic-only evidence
        run: |
          {
            echo '### Pass 16 Accounting HTTP delivery resilience'
            echo "Commit: $GITHUB_SHA"
            echo 'Ephemeral PostgreSQL 16 and loopback-only synthetic Accounting receiver.'
            echo 'Checks: 503 before acceptance, recovery, persisted downstream acceptance with lost ACK, retry deduplication, no redelivery after sync.'
            echo 'No production Accounting, payment, Inventory, credentials or sales involved.'
            echo 'Does not certify real staging contracts or live reconciliation.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Capture non-sensitive evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pass16-accounting-http-replay
          path: /tmp/pass16-accounting-replay.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Show synthetic stub logs on failure
        if: failure()
        run: tail -50 /tmp/pass16-accounting-stub.log || true
      - name: Stop loopback stub
        if: always()
        run: |
          if test -f /tmp/pass16-accounting-stub.pid; then
            kill "$(cat /tmp/pass16-accounting-stub.pid)" 2>/dev/null || true
          fi
