name: Pass 9 lockfile generation

on:
  pull_request:

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.ref == 'agent/remediation-09-production-equivalent-ci'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Require clean production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit regenerated lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
          else
            git commit -m "Pass 9: lock Playwright and Axe dependencies"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
