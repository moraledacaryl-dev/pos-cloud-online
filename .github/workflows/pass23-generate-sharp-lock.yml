name: Pass 23 generate sharp lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/pass23-integration-transport-hardening'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/pass23-integration-transport-hardening
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate and commit patched lockfile
        run: |
          cd frontend
          npm install --package-lock-only --save-exact sharp@0.35.4
          npm audit --omit=dev --audit-level=high
          cd ..
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json
          git commit -m 'Patch sharp dependency to 0.35.4'
          git push origin HEAD:agent/pass23-integration-transport-hardening
