name: Pass 23 generate sharp lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    if: github.head_ref == 'agent/pass23-integration-transport-hardening'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate patched lockfile
        working-directory: frontend
        run: |
          npm install --package-lock-only --save-exact sharp@0.35.4
          npm audit --omit=dev --audit-level=high
          echo 'LOCKFILE_GZIP_BASE64_BEGIN'
          gzip -c package-lock.json | base64 -w 0
          echo
          echo 'LOCKFILE_GZIP_BASE64_END'
