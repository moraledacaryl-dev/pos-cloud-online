name: Visual audit screenshots

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Screenshot matrix depth
        required: true
        default: full
        type: choice
        options:
          - full
          - smoke
      full_page:
        description: Capture full-page images in addition to viewport images
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-audit-screenshots.yml'
      - 'frontend/e2e/visual-audit.spec.mjs'
      - 'frontend/scripts/verify-visual-audit-manifest.mjs'
      - 'backend/scripts/seed_visual_audit.py'
      - 'backend/scripts/visual_audit_accounting_stub.py'
  pull_request:
    paths:
      - 'backend/scripts/seed_visual_audit.py'
      - 'backend/scripts/visual_audit_accounting_stub.py'
      - 'frontend/e2e/visual-audit.spec.mjs'
      - 'frontend/scripts/verify-visual-audit-manifest.mjs'
      - 'frontend/tests/visualAuditEvidence.test.mjs'
      - 'frontend/package.json'
      - '.github/workflows/visual-audit-screenshots.yml'

permissions:
  contents: read

jobs:
  visual-audit:
    name: Deterministic POS screenshot matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos_visual_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos_visual_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pos:pos@127.0.0.1:5432/pos_visual_audit
      REDIS_URL: redis://127.0.0.1:6379/0
      ENVIRONMENT: development
      SECRET_KEY: VisualAuditSigningKey_2026_0123456789abcdef
      ALLOW_DEFAULT_ADMIN_BOOTSTRAP: 'false'
      STARTUP_REQUIRE_MIGRATIONS: 'true'
      RATE_LIMIT_ENABLED: 'false'
      RATE_LIMIT_BACKEND: redis
      CORS_ORIGINS: http://127.0.0.1:8080
      ACCOUNTING_API_BASE: http://127.0.0.1:18993/api
      SYNC_WORKER_POLL_SECONDS: '1'
      VISUAL_AUDIT_CI: '1'
      HTTP_TIMEOUT_SECONDS: '1'
      NEXT_PUBLIC_API_BASE: /api
      E2E_BASE_URL: http://127.0.0.1:8080
      E2E_OWNER_USERNAME: ci-owner
      E2E_OWNER_PASSWORD: CiOwnerPassword-2026!
      E2E_MANAGER_USERNAME: ci-manager
      E2E_MANAGER_PASSWORD: CiManagerPassword-2026!
      E2E_CASHIER_USERNAME: ci-cashier
      E2E_CASHIER_PASSWORD: CiCashierPassword-2026!
      E2E_KITCHEN_USERNAME: ci-kitchen
      E2E_KITCHEN_PASSWORD: CiKitchenPassword-2026!

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.lock

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Provision ephemeral integration signing credentials
        run: |
          echo "ACCOUNTING_INTEGRATION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "INTEGRATION_API_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Migrate and provision visual-audit users and scenarios
        working-directory: backend
        run: |
          alembic upgrade head
          ADMIN_USERNAME=ci-owner ADMIN_FULL_NAME='Visual Audit Owner' ADMIN_ROLE=owner ADMIN_PASSWORD='CiOwnerPassword-2026!' python scripts/create_admin.py
          ADMIN_USERNAME=ci-manager ADMIN_FULL_NAME='Visual Audit Manager' ADMIN_ROLE=manager ADMIN_PASSWORD='CiManagerPassword-2026!' python scripts/create_admin.py
          ADMIN_USERNAME=ci-cashier ADMIN_FULL_NAME='Visual Audit Cashier' ADMIN_ROLE=cashier ADMIN_PASSWORD='CiCashierPassword-2026!' python scripts/create_admin.py
          ADMIN_USERNAME=ci-kitchen ADMIN_FULL_NAME='Visual Audit Kitchen' ADMIN_ROLE=kitchen ADMIN_PASSWORD='CiKitchenPassword-2026!' python scripts/create_admin.py
          PYTHONPATH=. python scripts/seed_visual_audit.py

      - name: Verify evidence manifest contracts
        working-directory: frontend
        run: node --test tests/visualAuditEvidence.test.mjs

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start isolated POS stack with real sync heartbeat
        run: |
          set -euo pipefail
          (cd backend && python scripts/visual_audit_accounting_stub.py > /tmp/visual-audit-accounting.log 2>&1 & echo $! > /tmp/visual-audit-accounting.pid)
          (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8100 > /tmp/visual-audit-backend.log 2>&1 & echo $! > /tmp/visual-audit-backend.pid)
          (cd backend && python -m app.workers.sync_worker > /tmp/visual-audit-worker.log 2>&1 & echo $! > /tmp/visual-audit-worker.pid)
          (cd frontend && npm run start -- -H 127.0.0.1 -p 3100 > /tmp/visual-audit-frontend.log 2>&1 & echo $! > /tmp/visual-audit-frontend.pid)
          (cd frontend && node e2e/ci-proxy.mjs > /tmp/visual-audit-proxy.log 2>&1 & echo $! > /tmp/visual-audit-proxy.pid)
          ready=0
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:18993/healthz >/dev/null 2>&1 &&
               curl -fsS http://127.0.0.1:8100/healthz >/dev/null 2>&1 &&
               curl -fsS http://127.0.0.1:8080/login >/dev/null 2>&1 &&
               curl -fsS http://127.0.0.1:8100/readyz/integrations >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            curl -fsS http://127.0.0.1:8100/internal/healthz/details | python -c 'import json,sys; r=json.load(sys.stdin); print("Visual baseline readiness reasons:", r.get("reasons"))' || true
          fi
          test "$ready" = 1 || {
            tail -60 /tmp/visual-audit-accounting.log || true
            tail -60 /tmp/visual-audit-worker.log || true
            tail -60 /tmp/visual-audit-backend.log || true
            tail -60 /tmp/visual-audit-frontend.log || true
            tail -60 /tmp/visual-audit-proxy.log || true
            exit 1
          }

      - name: Require healthy Accounting and sync worker screenshot baseline
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8100/internal/healthz/details > /tmp/visual-audit-health.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/visual-audit-health.json'))
          assert report.get('sales_ready'), 'POS selling readiness failed before screenshots'
          assert report.get('accounting_api', {}).get('ok'), 'Synthetic Accounting health is not ready'
          assert not report.get('sync_worker', {}).get('is_stale'), 'Real POS sync worker is not healthy'
          print('VISUAL_AUDIT_HEALTHY_BASELINE=PASS')
          PY
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -d '{}' http://127.0.0.1:18993/api/integrations/pos/order)" = 405

      - name: Resolve audit mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "VISUAL_AUDIT_MODE=smoke" >> "$GITHUB_ENV"
            echo "VISUAL_AUDIT_FULL_PAGE=false" >> "$GITHUB_ENV"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            # Certify the exact merged source with the full 478-PNG matrix.
            echo "VISUAL_AUDIT_MODE=full" >> "$GITHUB_ENV"
            echo "VISUAL_AUDIT_FULL_PAGE=true" >> "$GITHUB_ENV"
          else
            echo "VISUAL_AUDIT_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
            echo "VISUAL_AUDIT_FULL_PAGE=${{ inputs.full_page }}" >> "$GITHUB_ENV"
          fi

      - name: Capture visual audit
        working-directory: frontend
        run: npx playwright test e2e/visual-audit.spec.mjs --project=chromium --reporter=list

      - name: Verify screenshot evidence coverage and exact commit
        working-directory: frontend
        run: node scripts/verify-visual-audit-manifest.mjs


      - name: Summarize screenshot manifest
        if: always()
        working-directory: frontend
        run: |
          if [[ -f visual-audit/manifest.json ]]; then
            node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('visual-audit/manifest.json', 'utf8'));
          const byRole = {};
          for (const row of manifest.captures || []) byRole[row.role] = (byRole[row.role] || 0) + 1;
          console.log(`captures=${manifest.captures?.length || 0}`);
          console.log(`mode=${manifest.mode}`);
          console.log('captures_by_role=' + JSON.stringify(byRole));
          NODE
          fi

      - name: Upload visual audit screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pos-visual-audit-${{ github.run_id }}
          path: |
            frontend/visual-audit
            frontend/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Show service logs on failure
        if: failure()
        run: |
          cat /tmp/visual-audit-backend.log || true
          cat /tmp/visual-audit-worker.log || true
          cat /tmp/visual-audit-accounting.log || true
          cat /tmp/visual-audit-frontend.log || true
          cat /tmp/visual-audit-proxy.log || true

      - name: Stop isolated services
        if: always()
        run: |
          kill "$(cat /tmp/visual-audit-proxy.pid)" 2>/dev/null || true
          kill "$(cat /tmp/visual-audit-frontend.pid)" 2>/dev/null || true
          kill "$(cat /tmp/visual-audit-backend.pid)" 2>/dev/null || true
          kill "$(cat /tmp/visual-audit-worker.pid)" 2>/dev/null || true
          kill "$(cat /tmp/visual-audit-accounting.pid)" 2>/dev/null || true
