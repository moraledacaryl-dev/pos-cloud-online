name: Deploy POS

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character commit SHA to deploy
        required: true
        type: string
      target_environment:
        description: Protected GitHub environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: pos-deploy-${{ inputs.target_environment }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: release
        name: Validate exact release commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$RELEASE_SHA^{commit}"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Frontend contract tests and build
        working-directory: frontend
        run: |
          npm ci
          npm run test:ui
          npm run build
      - name: Backend contract tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          ruff check app tests
          PYTHONPATH=. pytest -q

  deploy:
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.target_environment }}
    steps:
      - name: Deploy and certify exact SHA
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          EXPECTED_COMMIT: ${{ needs.verify-release.outputs.release_sha }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          PUBLIC_BASE: ${{ vars.PUBLIC_BASE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: EXPECTED_COMMIT,TARGET_ENVIRONMENT,PUBLIC_BASE
          command_timeout: 25m
          script: |
            cd /opt/pos-cloud-online
            CONFIRM_DEPLOY=YES EXPECTED_COMMIT="$EXPECTED_COMMIT" TARGET_ENVIRONMENT="$TARGET_ENVIRONMENT" PUBLIC_BASE="$PUBLIC_BASE" bash scripts/deploy-release.sh
      - id: evidence
        name: Capture non-sensitive deployment evidence
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          EXPECTED_COMMIT: ${{ needs.verify-release.outputs.release_sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: EXPECTED_COMMIT
          capture_stdout: true
          script: |
            EVIDENCE_FILE="/var/lib/hiddenoasis-pos/deploy-evidence/${EXPECTED_COMMIT}.txt"
            test -r "$EVIDENCE_FILE"
            cat -- "$EVIDENCE_FILE"
      - name: Materialize deployment evidence artifact
        env:
          DEPLOYMENT_EVIDENCE: ${{ steps.evidence.outputs.stdout }}
          RELEASE_SHA: ${{ needs.verify-release.outputs.release_sha }}
        run: |
          mkdir -p deployment-evidence
          printf '%s\n' "$DEPLOYMENT_EVIDENCE" > "deployment-evidence/${RELEASE_SHA}.txt"
          test -s "deployment-evidence/${RELEASE_SHA}.txt"
      - name: Upload deployment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pos-deployment-${{ inputs.target_environment }}-${{ needs.verify-release.outputs.release_sha }}
          path: deployment-evidence
          if-no-files-found: error
          retention-days: 90
