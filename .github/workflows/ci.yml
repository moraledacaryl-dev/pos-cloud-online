name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'cleanup/**'
      - 'recovery/**'

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./ci-pos.db
      SECRET_KEY: ci-secret-key-do-not-use
      ACCESS_TOKEN_SECRET: ci-access-token-secret
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret
      STARTUP_REQUIRE_MIGRATIONS: 'false'
      RATE_LIMIT_ENABLED: 'false'
      RATE_LIMIT_BACKEND: memory
      ACCOUNTING_API_BASE: https://accounting.hiddenoasis.app/api
      ACCOUNTING_API_TOKEN: ci-placeholder-token
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install locked backend and quality dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.lock

      - name: Run backend static checks
        run: ruff check app tests

      - name: Validate certification and rehearsal scripts
        working-directory: .
        run: |
          bash -n scripts/production-certify.sh
          bash -n scripts/adversarial-production-certify.sh
          bash -n scripts/pass16-staging-certify.sh
          bash -n scripts/pass16-restore-rehearsal.sh

      - name: Run backend tests
        run: python -m pytest tests

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify supported runtime baseline
        run: node -e "const major=Number(process.versions.node.split('.')[0]); if (major !== 24) process.exit(1); console.log('Node', process.version)" && npm ls next sharp postcss nanoid

      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high

      - name: Lint, test, build, and smoke frontend
        run: npm run verify
