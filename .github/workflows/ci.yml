name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'cleanup/**'
      - 'recovery/**'

permissions:
  contents: write

jobs:
  pass20-remediate:
    name: Pass 20 branch remediation
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/pass20-utc-final-recert'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Replace deprecated UTC calls and commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('backend/app/api/reports.py'): [
                  ('from datetime import datetime', 'from datetime import UTC, datetime'),
                  ('datetime.utcnow()', 'datetime.now(UTC).replace(tzinfo=None)'),
              ],
              Path('backend/app/services/pos_service.py'): [
                  ('from datetime import datetime', 'from datetime import UTC, datetime'),
                  ('datetime.utcnow()', 'datetime.now(UTC).replace(tzinfo=None)'),
              ],
              Path('backend/app/services/sync_service.py'): [
                  ('datetime.utcnow()', 'datetime.now(timezone.utc).replace(tzinfo=None)'),
              ],
              Path('backend/tests/test_staff_readiness.py'): [
                  ('from datetime import datetime, timedelta', 'from datetime import UTC, datetime, timedelta'),
                  ('datetime.utcnow()', 'datetime.now(UTC).replace(tzinfo=None)'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text)

          guard = Path('backend/tests/test_pass20_utc_compatibility.py')
          guard.write_text("""from pathlib import Path\n\n\ndef test_application_code_has_no_deprecated_datetime_utcnow_calls():\n    app_root = Path(__file__).resolve().parents[1] / 'app'\n    offenders = []\n    for path in app_root.rglob('*.py'):\n        if 'datetime.utcnow(' in path.read_text():\n            offenders.append(str(path.relative_to(app_root)))\n    assert not offenders, f'deprecated datetime.utcnow() remains in: {offenders}'\n""")

          offenders = [
              str(path)
              for path in Path('backend/app').rglob('*.py')
              if 'datetime.utcnow(' in path.read_text()
          ]
          if offenders:
              raise SystemExit(f'datetime.utcnow remains: {offenders}')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/api/reports.py \
                  backend/app/services/pos_service.py \
                  backend/app/services/sync_service.py \
                  backend/tests/test_staff_readiness.py \
                  backend/tests/test_pass20_utc_compatibility.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No remediation changes required.'
            exit 0
          fi
          git commit -m 'Pass 20: remove deprecated UTC calls'
          git push origin HEAD:${{ github.head_ref }}

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./ci-pos.db
      SECRET_KEY: ci-secret-key-do-not-use
      ACCESS_TOKEN_SECRET: ci-access-token-secret
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret
      STARTUP_REQUIRE_MIGRATIONS: 'false'
      RATE_LIMIT_ENABLED: 'false'
      RATE_LIMIT_BACKEND: memory
      ACCOUNTING_API_BASE: https://accounting.hiddenoasis.app/api
      ACCOUNTING_API_TOKEN: ci-placeholder-token
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install locked backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.lock

      - name: Validate certification and rehearsal scripts
        working-directory: .
        run: |
          bash -n scripts/production-certify.sh
          bash -n scripts/adversarial-production-certify.sh
          bash -n scripts/pass16-staging-certify.sh
          bash -n scripts/pass16-restore-rehearsal.sh

      - name: Run backend tests
        run: python -m pytest tests

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify supported runtime baseline
        run: node -e "const major=Number(process.versions.node.split('.')[0]); if (major !== 24) process.exit(1); console.log('Node', process.version)" && npm ls next sharp postcss nanoid

      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend contract tests
        run: npm run test:ui

      - name: Build frontend
        run: npm run build
