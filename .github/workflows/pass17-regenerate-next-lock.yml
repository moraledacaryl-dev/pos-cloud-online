name: Pass 17 regenerate Next lockfile

on:
  push:
    branches:
      - agent/pass17-next-security-patch
    paths:
      - .github/workflows/pass17-regenerate-next-lock.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass17-next-security-patch
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile for pinned Next security release
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify exact patched version
        working-directory: frontend
        run: |
          node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/next'].version !== '16.3.3') process.exit(1)"
          grep -q '"next": "16.3.3"' package-lock.json
      - name: Commit regenerated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Pass 17: regenerate Next.js 16.3.3 lockfile'
          git push origin HEAD:agent/pass17-next-security-patch
