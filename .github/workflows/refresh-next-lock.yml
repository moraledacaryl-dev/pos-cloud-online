name: Refresh Next lock

on:
  push:
    branches:
      - agent/security-next-16-3-3
    paths:
      - frontend/package.json
      - .github/workflows/refresh-next-lock.yml

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh lockfile only
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched Next.js lock and audit production dependencies
        working-directory: frontend
        run: |
          node -e "const p=require('./package-lock.json'); if (p.packages['node_modules/next'].version !== '16.3.3') process.exit(1)"
          npm audit --omit=dev --audit-level=high
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: next-16-3-3-lock
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 1
