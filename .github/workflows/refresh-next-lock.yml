name: Refresh Next lock

on:
  push:
    branches:
      - agent/security-next-16-3-3
    paths:
      - frontend/package.json
      - .github/workflows/refresh-next-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show runner versions
        run: node --version && npm --version
      - name: Refresh lockfile only
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched Next.js lock and audit production dependencies
        working-directory: frontend
        run: |
          node -e "const p=require('./package-lock.json'); if (p.packages['node_modules/next'].version !== '16.3.3') process.exit(1)"
          npm audit --omit=dev --audit-level=high
      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git commit -m 'Security: refresh Next.js 16.3.3 lockfile'
          git push origin HEAD:agent/security-next-16-3-3
