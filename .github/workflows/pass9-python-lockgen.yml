name: Pass 9 Python lock migration

on:
  pull_request:

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.ref == 'agent/remediation-09-production-equivalent-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrate exact lock away from python-jose native crypto dependencies
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('requirements.lock')
          rows = path.read_text().splitlines()
          remove = {'python-jose', 'ecdsa', 'rsa', 'pyasn1'}
          kept = []
          for row in rows:
              stripped = row.strip()
              if not stripped or stripped.startswith('#') or '==' not in stripped:
                  kept.append(row)
                  continue
              name = stripped.split('==', 1)[0].strip().lower()
              if name not in remove:
                  kept.append(row)
          kept.append('PyJWT==2.13.0')
          path.write_text('\n'.join(kept).rstrip() + '\n')
          PY
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip check
          python - <<'PY'
          import jwt
          assert jwt.__version__ == '2.13.0'
          print('PyJWT', jwt.__version__)
          PY
          python -m pip install pip-audit
          pip-audit -r requirements.lock
      - name: Commit generated Python lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/requirements.lock
          if git diff --cached --quiet; then
            echo "requirements.lock already migrated"
          else
            git commit -m "Pass 9: lock PyJWT and remove vulnerable ecdsa path"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
