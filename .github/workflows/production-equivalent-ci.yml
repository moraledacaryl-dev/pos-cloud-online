name: Production-equivalent CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  postgres-redis-integration:
    name: PostgreSQL, Redis, Alembic, worker, abuse tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://pos:pos@127.0.0.1:5432/pos_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ci-secret-key-do-not-use
      ACCESS_TOKEN_SECRET: ci-access-token-secret
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret
      STARTUP_REQUIRE_MIGRATIONS: 'false'
      RATE_LIMIT_ENABLED: 'false'
      RATE_LIMIT_BACKEND: memory
      ACCOUNTING_API_BASE: http://127.0.0.1:9/api
      ACCOUNTING_API_TOKEN: ci-placeholder-token
      HTTP_TIMEOUT_SECONDS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.lock
      - name: Verify service connectivity
        run: |
          python - <<'PY'
          import psycopg
          from redis import Redis
          with psycopg.connect('postgresql://pos:pos@127.0.0.1:5432/pos_ci') as conn:
              with conn.cursor() as cur:
                  cur.execute('select 1')
                  assert cur.fetchone()[0] == 1
          assert Redis.from_url('redis://127.0.0.1:6379/0').ping() is True
          print('PostgreSQL and Redis are reachable')
          PY
      - name: Validate migration lifecycle from previous head
        run: |
          alembic upgrade 0008_manager_approval_grants
          alembic upgrade head
          alembic current | grep 0009_customer_display_devices
          alembic heads | grep 0009_customer_display_devices
          alembic check
          alembic downgrade 0008_manager_approval_grants
          alembic current | grep 0008_manager_approval_grants
          alembic upgrade head
          alembic current | grep 0009_customer_display_devices
      - name: Run full backend suite against PostgreSQL
        run: python -m pytest tests -q
      - name: Run PostgreSQL approval concurrency abuse regression
        env:
          RUN_POSTGRES_INTEGRATION: '1'
        run: python -m pytest tests/test_postgres_manager_approval_concurrency.py -q
      - name: Run real Redis rate-limit and ticket regressions
        env:
          RUN_REDIS_INTEGRATION: '1'
        run: python -m pytest tests/test_redis_runtime_integration.py -q
      - name: Reset PostgreSQL for real worker process
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://pos:pos@127.0.0.1:5432/pos_ci', autocommit=True) as conn:
              with conn.cursor() as cur:
                  cur.execute('DROP SCHEMA public CASCADE')
                  cur.execute('CREATE SCHEMA public')
          PY
          alembic upgrade head
      - name: Run actual sync worker and require heartbeat
        env:
          ENVIRONMENT: development
          SYNC_WORKER_POLL_SECONDS: '1'
          RATE_LIMIT_ENABLED: 'false'
          ACCOUNTING_API_BASE: http://127.0.0.1:9/api
        run: |
          python -m app.workers.sync_worker > /tmp/pos-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 20); do
            if python - <<'PY'
          from app.db.database import SessionLocal
          from app.services.pos_service import setting_json
          with SessionLocal() as db:
              heartbeat = setting_json(db, 'sync_worker_heartbeat', default={}) or {}
          raise SystemExit(0 if heartbeat.get('last_seen_at') else 1)
          PY
            then
              ok=1
              break
            fi
            sleep 1
          done
          cat /tmp/pos-worker.log
          test "$ok" = 1
          kill "$WORKER_PID" 2>/dev/null || true
          wait "$WORKER_PID" 2>/dev/null || true

  kds-live-load:
    name: Live KDS SSE load against PostgreSQL + Redis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos_kds
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos_kds"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+psycopg://pos:pos@127.0.0.1:5432/pos_kds
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: PassNineStageSigningKey_2026_0123456789abcdef
      ACCOUNTING_INTEGRATION_SECRET: PassNineAccountingSecret_2026_abcdef0123456789
      INTEGRATION_API_KEY: PassNineIntegrationApiKey_2026_abcdef0123456789
      ALLOW_DEFAULT_ADMIN_BOOTSTRAP: 'false'
      STARTUP_REQUIRE_MIGRATIONS: 'true'
      RATE_LIMIT_ENABLED: 'true'
      RATE_LIMIT_BACKEND: redis
      RATE_LIMIT_PER_MINUTE: '1000'
      KDS_STREAM_MAX_PER_USER: '25'
      KDS_STREAM_MAX_LIFETIME_SECONDS: '120'
      CORS_ORIGINS: http://127.0.0.1:8100
      ACCOUNTING_API_BASE: http://127.0.0.1:9/api
      HTTP_TIMEOUT_SECONDS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.lock
      - name: Migrate and provision KDS owner
        env:
          ADMIN_USERNAME: ci-owner
          ADMIN_FULL_NAME: CI Owner
          ADMIN_ROLE: owner
          ADMIN_PASSWORD: CiOwnerPassword-2026!
        run: |
          alembic upgrade head
          python scripts/create_admin.py
      - name: Start staging-equivalent backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8100 > /tmp/pos-backend.log 2>&1 &
          echo $! > /tmp/pos-backend.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8100/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pos-backend.log
          exit 1
      - name: Run twenty-stream pool starvation regression
        run: |
          KDS_LOAD_BEARER="$(python - <<'PY'
          from app.db.database import SessionLocal
          from app.models.entities import User
          from app.services.auth_service import create_access_token
          with SessionLocal() as db:
              user = db.query(User).filter(User.username == 'ci-owner').one()
              print(create_access_token(user.username, session_version=int(user.session_version or 1)))
          PY
          )"
          export KDS_LOAD_BEARER
          KDS_LOAD_STREAMS=20 python scripts/ci_kds_stream_load.py
      - name: Show backend logs on failure
        if: failure()
        run: cat /tmp/pos-backend.log || true
      - name: Stop backend
        if: always()
        run: kill "$(cat /tmp/pos-backend.pid)" 2>/dev/null || true

  browser-e2e:
    name: Playwright browser E2E + Axe
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d pos_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pos:pos@127.0.0.1:5432/pos_browser
      REDIS_URL: redis://127.0.0.1:6379/0
      ENVIRONMENT: development
      SECRET_KEY: BrowserE2ESigningKey_2026_0123456789abcdef
      ALLOW_DEFAULT_ADMIN_BOOTSTRAP: 'false'
      STARTUP_REQUIRE_MIGRATIONS: 'true'
      RATE_LIMIT_ENABLED: 'true'
      RATE_LIMIT_BACKEND: redis
      RATE_LIMIT_PER_MINUTE: '1000'
      CORS_ORIGINS: http://127.0.0.1:8080
      ACCOUNTING_API_BASE: http://127.0.0.1:9/api
      HTTP_TIMEOUT_SECONDS: '1'
      NEXT_PUBLIC_API_BASE: /api
      E2E_BASE_URL: http://127.0.0.1:8080
      E2E_OWNER_USERNAME: ci-owner
      E2E_OWNER_PASSWORD: CiOwnerPassword-2026!
      E2E_CASHIER_USERNAME: ci-cashier
      E2E_CASHIER_PASSWORD: CiCashierPassword-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.lock
      - name: Install frontend dependencies and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Migrate and provision browser users
        working-directory: backend
        run: |
          alembic upgrade head
          ADMIN_USERNAME=ci-owner ADMIN_FULL_NAME='CI Owner' ADMIN_ROLE=owner ADMIN_PASSWORD='CiOwnerPassword-2026!' python scripts/create_admin.py
          ADMIN_USERNAME=ci-cashier ADMIN_FULL_NAME='CI Cashier' ADMIN_ROLE=cashier ADMIN_PASSWORD='CiCashierPassword-2026!' python scripts/create_admin.py
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start backend frontend and same-origin proxy
        run: |
          (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8100 > /tmp/e2e-backend.log 2>&1 & echo $! > /tmp/e2e-backend.pid)
          (cd frontend && npm run start -- -H 127.0.0.1 -p 3100 > /tmp/e2e-frontend.log 2>&1 & echo $! > /tmp/e2e-frontend.pid)
          (cd frontend && node e2e/ci-proxy.mjs > /tmp/e2e-proxy.log 2>&1 & echo $! > /tmp/e2e-proxy.pid)
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8100/healthz >/dev/null && curl -fsS http://127.0.0.1:3100/login >/dev/null && curl -fsS http://127.0.0.1:8080/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/e2e-backend.log || true
          cat /tmp/e2e-frontend.log || true
          cat /tmp/e2e-proxy.log || true
          exit 1
      - name: Run Playwright browser and Axe acceptance
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
      - name: Show service logs on failure
        if: failure()
        run: |
          cat /tmp/e2e-backend.log || true
          cat /tmp/e2e-frontend.log || true
          cat /tmp/e2e-proxy.log || true
      - name: Stop E2E services
        if: always()
        run: |
          kill "$(cat /tmp/e2e-proxy.pid)" 2>/dev/null || true
          kill "$(cat /tmp/e2e-frontend.pid)" 2>/dev/null || true
          kill "$(cat /tmp/e2e-backend.pid)" 2>/dev/null || true

  dependency-security:
    name: Dependency security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Scan locked Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.lock
      - name: Scan production npm dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
